<header class="flex w-full h-16 px-6 items-center mb-4 bg-white shadow-card border-b border-surface-200">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 bg-gradient-to-br from-medical-600 to-medical-800 text-white rounded-lg flex items-center justify-center shadow-md">
      <fa-icon [icon]="faImage" class="text-lg"></fa-icon>
    </div>
    <div>
      <h1 class="text-lg font-bold text-surface-800 tracking-tight">AreaDot</h1>
      <p class="text-xs text-surface-500 font-medium">Estimador Monte Carlo de manchas radiográficas</p>
    </div>
  </div>
</header>

<div class="px-4 md:px-6 lg:px-8 pt-0 pb-4">
  <div class="bg-white rounded-xl shadow-card overflow-hidden border border-surface-200">
    <mat-tab-group
      [selectedIndex]="selectedTabIndex"
      (selectedIndexChange)="onTabChange($event)"
      class="custom-tab-group"
      dynamicHeight
    >
      <mat-tab>
        <ng-template mat-tab-label>
          <fa-icon [icon]="faCalculator" class="mr-2 text-medical-600"></fa-icon>
          <span class="font-medium">Calcular área</span>
        </ng-template>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <fa-icon [icon]="faClockRotateLeft" class="mr-2 text-medical-600"></fa-icon>
          <span class="font-medium">Resultados anteriores</span>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>

<router-outlet></router-outlet>
