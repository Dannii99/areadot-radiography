<div class="bg-white rounded-xl border border-surface-200 shadow-card overflow-hidden">
  <div class="px-5 py-3 border-b border-surface-100 bg-surface-50">
    <p class="text-xs font-semibold text-surface-500 uppercase tracking-wide">Progreso del análisis</p>
  </div>

  <div class="px-5 py-4">
    <div class="flex items-stretch gap-0">
      @for (step of steps; track $index; let i = $index; let last = $last) {
        <div class="flex flex-col items-center flex-1 relative">
          <div class="flex items-center justify-center w-10 h-10 rounded-full text-sm font-bold flex-shrink-0 transition-all duration-300 relative z-10"
            [ngClass]="{
              'bg-emerald-500 text-white shadow-md': step.done,
              'bg-medical-600 text-white shadow-lg ring-4 ring-medical-100 scale-110': !step.done && i === currentStepIndex,
              'bg-surface-100 text-surface-400 border-2 border-surface-200': !step.done && i !== currentStepIndex
            }">
            @if (step.done) {
              <fa-icon [icon]="faCheck" class="text-sm"></fa-icon>
            } @else {
              <span>{{ i + 1 }}</span>
            }
          </div>

          <div class="mt-3 text-center">
            <p class="text-sm font-semibold whitespace-nowrap"
              [ngClass]="{
                'text-emerald-700': step.done,
                'text-medical-700': !step.done && i === currentStepIndex,
                'text-surface-400': !step.done && i !== currentStepIndex
              }">
              {{ step.label }}
            </p>
            @if (step.description) {
              <p class="text-xs mt-0.5 max-w-[120px] mx-auto leading-tight"
                [ngClass]="{
                  'text-emerald-600': step.done,
                  'text-medical-500': !step.done && i === currentStepIndex,
                  'text-surface-300': !step.done && i !== currentStepIndex
                }">
                {{ step.description }}
              </p>
            }
          </div>

          @if (!last) {
            <div class="absolute top-5 left-[calc(50%+24px)] right-[calc(-50%+24px)] h-0.5 -translate-y-1/2"
              [ngClass]="step.done ? 'bg-emerald-400' : 'bg-surface-200'">
              @if (step.done) {
                <div class="absolute inset-0 bg-emerald-400 animate-pulse"></div>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
