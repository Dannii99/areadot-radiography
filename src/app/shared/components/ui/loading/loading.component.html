@if (visible) {
  <div class="fixed inset-0 bg-surface-900/40 backdrop-blur-sm flex flex-col items-center justify-center z-50 w-screen h-screen">
    <div class="bg-white rounded-2xl shadow-elevated p-8 flex flex-col items-center gap-4 min-w-[280px]">
      <mat-progress-spinner mode="indeterminate" diameter="48" color="primary"></mat-progress-spinner>
      <p class="text-base font-semibold text-surface-800">{{ message }}</p>
      <span class="text-sm text-surface-500">Por favor espera...</span>
    </div>
  </div>
}
